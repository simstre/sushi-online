<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 720" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Online food ordering: a phone showing a live order with floating food icons">
  <defs>
    <radialGradient id="glowSage" cx="0.2" cy="0.25" r="0.65">
      <stop offset="0%" stop-color="#9BB58A" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#9BB58A" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowBag" cx="0.85" cy="0.8" r="0.65">
      <stop offset="0%" stop-color="#D9A441" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#D9A441" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="screenGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F8F1E4"/>
    </linearGradient>
    <linearGradient id="ctaGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#34503D"/>
      <stop offset="100%" stop-color="#1c2a22"/>
    </linearGradient>
  </defs>

  <!-- Glow blobs -->
  <rect width="800" height="720" fill="url(#glowSage)"/>
  <rect width="800" height="720" fill="url(#glowBag)"/>

  <!-- Decorative orbital dotted ellipses -->
  <g fill="none" stroke="#34503D" stroke-opacity="0.10" stroke-width="1.5" stroke-dasharray="2 8">
    <ellipse cx="400" cy="370" rx="340" ry="270"/>
    <ellipse cx="400" cy="370" rx="240" ry="180"/>
  </g>

  <!-- Order-in-progress badge floating top center -->
  <g transform="translate(400 70)">
    <rect x="-118" y="-22" width="236" height="44" rx="22" fill="#FFFFFF" stroke="#34503D" stroke-opacity="0.18" stroke-width="1.5"/>
    <circle cx="-86" cy="0" r="5" fill="#9BB58A"/>
    <text x="-72" y="5" font-family="DM Mono, ui-monospace, monospace" font-size="12" font-weight="500" fill="#34503D" letter-spacing="2">ORDER IN PROGRESS</text>
  </g>

  <!-- Phone mockup, tilted -->
  <g transform="translate(220 140) rotate(-6 200 270)">
    <!-- Drop shadow -->
    <rect x="20" y="32" width="380" height="540" rx="44" fill="#34503D" opacity="0.18"/>
    <!-- Body -->
    <rect x="0" y="0" width="380" height="540" rx="44" fill="#1c2a22" stroke="#0f1812" stroke-width="2"/>
    <!-- Screen -->
    <rect x="16" y="16" width="348" height="508" rx="32" fill="url(#screenGrad)"/>
    <!-- Notch -->
    <rect x="155" y="22" width="70" height="14" rx="7" fill="#1c2a22"/>

    <!-- Header label -->
    <text x="40" y="78" font-family="DM Mono, ui-monospace, monospace" font-size="11" font-weight="500" fill="#B07820" letter-spacing="2.4">YOUR ORDER</text>
    <text x="40" y="108" font-family="Fraunces, Georgia, serif" font-size="22" font-weight="700" fill="#34503D">Sushi Canada</text>
    <line x1="40" y1="130" x2="340" y2="130" stroke="#D9A441" stroke-width="2"/>

    <!-- Items -->
    <g font-family="Nunito, system-ui, sans-serif" font-size="14" fill="#34503D">
      <text x="40" y="170" font-weight="600">Spicy Tuna Maki ×2</text>
      <text x="340" y="170" text-anchor="end" font-weight="700">$16.50</text>

      <text x="40" y="208" font-weight="600">Edamame</text>
      <text x="340" y="208" text-anchor="end" font-weight="700">$5.00</text>

      <text x="40" y="246" font-weight="600">Miso Soup</text>
      <text x="340" y="246" text-anchor="end" font-weight="700">$3.50</text>
    </g>

    <line x1="40" y1="280" x2="340" y2="280" stroke="#34503D" stroke-opacity="0.20" stroke-width="2" stroke-dasharray="4 4"/>

    <text x="40" y="322" font-family="Nunito, system-ui, sans-serif" font-size="16" font-weight="700" fill="#34503D">Total</text>
    <text x="340" y="322" text-anchor="end" font-family="Fraunces, Georgia, serif" font-size="22" font-weight="700" fill="#34503D">$25.00</text>

    <!-- CTA button -->
    <rect x="40" y="370" width="300" height="58" rx="29" fill="url(#ctaGrad)"/>
    <text x="190" y="408" text-anchor="middle" font-family="Nunito, system-ui, sans-serif" font-size="16" font-weight="700" fill="#F8F1E4">PLACE ORDER →</text>

    <!-- Footnote -->
    <text x="190" y="464" text-anchor="middle" font-family="DM Mono, ui-monospace, monospace" font-size="10" fill="#B07820" letter-spacing="1.8">SECURE CHECKOUT · STRIPE</text>
  </g>

  <!-- Floating food icons -->

  <!-- Sushi (top-left) -->
  <g transform="translate(80 200) rotate(-12)">
    <circle r="56" fill="#D9A441" opacity="0.20"/>
    <rect x="-40" y="-22" width="80" height="44" rx="10" fill="#FFFFFF" stroke="#34503D" stroke-width="2"/>
    <rect x="-40" y="-22" width="80" height="14" rx="6" fill="#B07820" stroke="#34503D" stroke-width="2"/>
    <line x1="-30" y1="-8" x2="-30" y2="22" stroke="#34503D" stroke-width="1.5" opacity="0.4"/>
    <line x1="0" y1="-8" x2="0" y2="22" stroke="#34503D" stroke-width="1.5" opacity="0.4"/>
    <line x1="30" y1="-8" x2="30" y2="22" stroke="#34503D" stroke-width="1.5" opacity="0.4"/>
  </g>

  <!-- Pizza slice (top-right) -->
  <g transform="translate(700 180) rotate(20)">
    <circle r="56" fill="#9BB58A" opacity="0.25"/>
    <path d="M -46 28 L 0 -50 L 46 28 Z" fill="#D9A441" stroke="#34503D" stroke-width="2.5"/>
    <path d="M -42 26 L 42 26" stroke="#B07820" stroke-width="2" opacity="0.5"/>
    <circle cx="-14" cy="4" r="5" fill="#34503D"/>
    <circle cx="14" cy="-4" r="5" fill="#34503D"/>
    <circle cx="0" cy="18" r="5" fill="#34503D"/>
  </g>

  <!-- Burger (bottom-left) -->
  <g transform="translate(80 540) rotate(8)">
    <circle r="56" fill="#D9A441" opacity="0.20"/>
    <path d="M -42 -10 Q -42 -38 0 -38 Q 42 -38 42 -10 Z" fill="#D9A441" stroke="#34503D" stroke-width="2"/>
    <circle cx="-18" cy="-22" r="2" fill="#FFFFFF"/>
    <circle cx="8" cy="-28" r="2" fill="#FFFFFF"/>
    <circle cx="22" cy="-18" r="2" fill="#FFFFFF"/>
    <rect x="-42" y="-8" width="84" height="6" fill="#9BB58A"/>
    <rect x="-42" y="0" width="84" height="8" fill="#34503D"/>
    <rect x="-42" y="10" width="84" height="6" fill="#F4D08A"/>
    <path d="M -42 16 Q -42 36 0 36 Q 42 36 42 16 Z" fill="#B07820" stroke="#34503D" stroke-width="2"/>
  </g>

  <!-- Coffee cup (bottom-right) -->
  <g transform="translate(700 560) rotate(-10)">
    <circle r="56" fill="#9BB58A" opacity="0.25"/>
    <path d="M -10 -50 Q -16 -56 -10 -62 Q -4 -68 -10 -74" stroke="#34503D" stroke-opacity="0.45" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M 10 -50 Q 4 -56 10 -62 Q 16 -68 10 -74" stroke="#34503D" stroke-opacity="0.45" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M -34 -28 L -27 34 Q -27 44 -17 44 L 17 44 Q 27 44 27 34 L 34 -28 Z" fill="#FFFFFF" stroke="#34503D" stroke-width="2.5"/>
    <ellipse cx="0" cy="-28" rx="34" ry="6" fill="#34503D"/>
    <path d="M 27 -8 Q 48 -8 48 14 Q 48 30 27 30" fill="none" stroke="#34503D" stroke-width="2.5"/>
  </g>

  <!-- Ramen bowl (mid-right) -->
  <g transform="translate(680 380)">
    <circle r="56" fill="#D9A441" opacity="0.20"/>
    <ellipse cx="0" cy="22" rx="50" ry="13" fill="#34503D" stroke="#1c2a22" stroke-width="2"/>
    <path d="M -50 22 L -45 5 Q 0 -6 45 5 L 50 22 Z" fill="#F4D08A" stroke="#34503D" stroke-width="2"/>
    <path d="M -30 5 Q -20 -3 -10 5 Q 0 -3 10 5 Q 20 -3 30 5" stroke="#B07820" stroke-width="2.5" fill="none"/>
    <ellipse cx="-15" cy="2" rx="8" ry="6" fill="#FFFFFF" stroke="#34503D" stroke-width="1.5"/>
    <ellipse cx="-15" cy="2" rx="3" ry="3" fill="#D9A441"/>
    <path d="M 0 -16 Q -4 -22 0 -28 Q 4 -34 0 -40" stroke="#34503D" stroke-opacity="0.4" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  </g>
</svg>
